<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>M2 物種：廢棄物異生體 (Trash-born Organism) 3D 垃圾場生態原型</title>
  <!-- p5.js library with WebGL 3D support -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0c0b0e;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #e0e0e6;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    /* UI Overlay */
    .hud {
      position: absolute;
      z-index: 10;
      pointer-events: none;
    }
    .hud-header {
      top: 20px;
      left: 24px;
      background: rgba(18, 16, 20, 0.85);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 16px 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.55);
      max-width: 420px;
    }
    .badge-group {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 4px 8px;
      border-radius: 4px;
      background: #3b4252;
      color: #eceff4;
    }
    .badge.phase {
      background: #81a1c1;
      color: #2e3440;
    }
    .badge.tag {
      background: #d08770;
      color: #24140e;
    }
    h1 {
      font-size: 18px;
      font-weight: 700;
      color: #eceff4;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }
    p.desc {
      font-size: 12px;
      color: #aab2c5;
      line-height: 1.55;
      margin-bottom: 8px;
    }
    .materials-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
      margin-bottom: 6px;
      font-size: 11px;
    }
    .mat-chip {
      padding: 2px 7px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .mat-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }
    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      font-size: 13px;
      font-weight: 600;
    }
    .status-indicator {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #88c0d0;
      box-shadow: 0 0 8px #88c0d0;
      transition: background 0.3s, box-shadow 0.3s;
    }
    /* Floating action toolbar */
    .hud-controls {
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(18, 16, 22, 0.9);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 40px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.65);
      pointer-events: auto;
    }
    .btn {
      background: #2b2e38;
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #e5e9f0;
      padding: 8px 16px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      white-space: nowrap;
    }
    .btn:hover {
      background: #3e4454;
      transform: translateY(-1px);
    }
    .btn.primary {
      background: #bf616a;
      border-color: #d08770;
      color: #fff;
    }
    .btn.primary:hover {
      background: #d08770;
    }
    .btn.active {
      background: #88c0d0;
      color: #2e3440;
      border-color: #88c0d0;
    }
    .divider {
      width: 1px;
      height: 24px;
      background: rgba(255, 255, 255, 0.15);
    }
    /* Instructions top right */
    .hud-help {
      top: 20px;
      right: 24px;
      background: rgba(18, 16, 22, 0.75);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 12px;
      color: #9ba4b8;
      line-height: 1.65;
    }
    .kbd {
      background: rgba(255, 255, 255, 0.14);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
      color: #eceff4;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- Header HUD -->
  <div class="hud hud-header">
    <div class="badge-group">
      <span class="badge">NTHU OOP · M2 物種原型</span>
      <span class="badge tag">垃圾場生態圈</span>
      <span class="badge phase" id="badge-phase">地面蛇行中</span>
    </div>
    <h1>垃圾碎屑拼裝異生體 (Trash Debris Assemblage)</h1>
    <p class="desc">
      身軀由<strong>鏽蝕瓦楞板、紅磚頭、尖銳玻璃碎片、壓扁鋁罐、廢輪胎皮與電路板</strong>等垃圾拼湊而成。遊蕩於垃圾山之間，具備<strong>零件不規則解構</strong>與<strong>直身極速撞散垃圾堆</strong>之習性。
    </p>

    <div class="materials-legend">
      <div class="mat-chip"><span class="mat-dot" style="background:#bf583b"></span>紅磚/水泥塊</div>
      <div class="mat-chip"><span class="mat-dot" style="background:#32c882"></span>碎玻璃尖角</div>
      <div class="mat-chip"><span class="mat-dot" style="background:#b87333"></span>鏽鐵瓦楞板</div>
      <div class="mat-chip"><span class="mat-dot" style="background:#e04040"></span>易開罐/油桶</div>
      <div class="mat-chip"><span class="mat-dot" style="background:#333538"></span>橡膠輪胎皮</div>
    </div>

    <div class="status-row">
      <div class="status-indicator" id="status-light"></div>
      <span id="status-text">動態階段：地面 S 型蛇行巡弋</span>
    </div>
  </div>

  <!-- Help HUD -->
  <div class="hud hud-help">
    <div>🖱️ <strong>滑鼠左鍵拖曳</strong>：旋轉 3D 視角 / 滾輪縮放</div>
    <div>💥 <span class="kbd">X</span>：切換<strong>不規則外殼零件拆分 / 聚合</strong></div>
    <div>⚡ <span class="kbd">空白鍵 (Space)</span>：直身鎖定並極速<strong>撞散垃圾堆</strong></div>
    <div>🧹 <span class="kbd">R</span>：重新堆整所有垃圾堆</div>
    <div>🎥 <span class="kbd">C</span>：切換鏡頭視角</div>
  </div>

  <!-- Interactive Controls Toolbar -->
  <div class="hud-controls">
    <button class="btn primary" id="btn-ram" title="立即鎖緊身體並直身衝撞垃圾堆">
      ⚡ 立即極速撞散 (Space)
    </button>
    <button class="btn" id="btn-split" title="將各類垃圾外殼不規則拆散/重組">
      💥 不規則拆分 (X)
    </button>
    <button class="btn" id="btn-reset-piles" title="重整散落的垃圾堆">
      🧹 重整垃圾堆 (R)
    </button>
    <div class="divider"></div>
    <button class="btn active" id="cam-orbit">自由視角 (Orbit)</button>
    <button class="btn" id="cam-follow">跟隨視角 (Follow)</button>
    <button class="btn" id="cam-action">特寫特寫 (Cinematic)</button>
    <div class="divider"></div>
    <button class="btn" id="btn-pause">暫停 / 播放</button>
  </div>

  <script src="sketch.js"></script>
</body>
</html>
